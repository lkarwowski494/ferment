name: TestFlight (Release & Deploy)

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notatki do wydania TestFlight (opcjonalne)'
        required: false
        default: 'Wydanie produkcyjne FERMENT Apps4Brew Studio'

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=3072
  FORCE_COLOR: '1'
  APP_SCHEME: 'Ferment'
  APP_DIR: 'Ferment'
  BUNDLE_ID: 'com.apps4brew.ferment'
  BUILD_BASE: '10'

jobs:
  gate:
    name: Verify Commit & CI Status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Verify commit is ancestor of main
        run: |
          git fetch origin main --depth=50
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Commit $GITHUB_SHA nie jest przodkiem gałęzi origin/main!"
            exit 1
          fi

  build:
    name: Archive & Upload (.ipa -> TestFlight)
    needs: gate
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      build_number: ${{ steps.ver.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select Xcode 26
        run: bash .github/scripts/select-xcode.sh 26

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Guard against test flags in release build
        run: |
          for var in EXPO_PUBLIC_STORE_FAKE EXPO_PUBLIC_E2E EXPO_PUBLIC_MOCK_AUTH EXPO_PUBLIC_DEMO_MODE; do
            val="${!var:-}"
            if [ -n "$val" ] && [ "$val" != "0" ]; then
              echo "::error::Flaga testowa $var=$val nie może być ustawiona w wydaniu produkcyjnym!"
              exit 1
            fi
          done

      - name: Prebuild native iOS project
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Verify native iOS invariants
        run: node scripts/verify-native.mjs

      - name: Compute version & build number
        id: ver
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          BUILD_NUMBER=$((BUILD_BASE + GITHUB_RUN_NUMBER))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Archive (Release, unsigned build step)
        env:
          CI: '1'
          NODE_ENV: production
        run: |
          echo "Building unsigned archive..."
          # Two-stage signing pattern

      - name: Summary
        run: |
          echo "### Wydanie TestFlight Gotowe" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parametr | Wartość |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Bundle ID** | \`$BUNDLE_ID\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Wersja** | \`${{ steps.ver.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Numer buildu** | \`${{ steps.ver.outputs.build_number }}\` |" >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Create Git Tag
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Create and push tag vX.Y.Z-bNNNN
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build_number }}
        run: |
          TAG="v${VERSION}-b${BUILD}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push origin "$TAG" --force
